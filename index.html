<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulateur de feux de forêt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; }
    #stats {
      position: fixed; top: 16px; left: 16px;
      background: rgba(20, 16, 12, 0.78);
      color: #f5ead9; padding: 12px 16px; border-radius: 10px;
      font-size: 14px; line-height: 1.65; backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 200, 140, 0.25);
      user-select: none; pointer-events: none;
    }
    #stats b { color: #ffb35c; }
    #stats[data-flash]::after {
      content: attr(data-flash);
      display: block; margin-top: 6px; color: #ffd28a; font-style: italic;
    }
    #hint {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 16, 12, 0.78); color: #f5ead9;
      padding: 10px 18px; border-radius: 999px; font-size: 14px;
      border: 1px solid rgba(255, 200, 140, 0.25);
      user-select: none; pointer-events: none;
      transition: opacity 0.6s;
    }
    #hint.hidden { opacity: 0; }
    .lil-gui { --background-color: rgba(20, 16, 12, 0.85) !important; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="stats">Surface brûlée : <b>0.0 %</b><br>Foyers actifs : <b>0</b><br>Temps simulé : <b>00:00</b></div>
  <div id="hint">Cliquez sur le terrain pour allumer un feu — molette / clic droit pour naviguer</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
